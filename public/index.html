<html lang="vi"><head><meta charset="utf-8">

<title>Vấn Đạo Tu Tiên</title>

<style>

button:focus-visible,input:focus-visible{outline:2px solid var(--gold)}
</style></head><body>

<div id="start"><h1>Vấn Đạo Tu Tiên</h1><p>Rời tông môn, đi khắp đại lục, săn yêu thú, đột phá cảnh giới và lên bảng xếp hạng.</p>
<div id="as" style="color:var(--jade);max-width:420px">Đang kết nối tài khoản...</div><input id="nm" maxlength="14" placeholder="Đạo hiệu của bạn" aria-label="Đạo hiệu" style="display:none"><button id="go" disabled>Vào game</button><button id="guest" style="display:none"></button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
let W=5000,H=3600;const WW=5000,WH=3600,CX=2500,CY=1800,SR=320,R=['Luyện Khí','Trúc Cơ','Kim Đan','Nguyên Anh','Hóa Thần','Luyện Hư'];

{n:'Tử Điện Phái',sh:'Tử Điện',x:800,y:2800,k:'#c08aff',a:'#e0b0ff',roof:'#6a3aa8',f:['#c0b4d4','#6a5a88'],cn:'tím sét'},

{n:'Lục Ngọc Bí Cảnh',min:3,boss:'Cổ Thụ Vương',be:'🌲',m:[['Thụ Yêu','🌳',1],['Độc Điệp','🦋',.8],['Hoa Yêu','🌺',.9]]},
{n:'Xích Viêm Hỏa Quật',min:6,boss:'Xích Long',be:'🐉',m:[['Hỏa Hồ','🦊',1],['Dung Nham Quái','🌋',1.3],['Hỏa Linh','🔥',.8]]},
{n:'Huyền Băng Tuyết Vực',min:9,boss:'Băng Hoàng Tượng',be:'🦣',m:[['Tuyết Lang','🐺',1],['Băng Linh','❄️',.8],['Tuyết Hùng','🐻',1.3]]},
{n:'Tử Điện Lôi Uyên',min:12,boss:'Lôi Long',be:'🐲',m:[['Điện Linh','⚡',.8],['Lôi Bức','🦇',.9],['Độc Hạt','🦂',1.2]]},
{n:'Kim Cương Phật Quốc',min:15,boss:'Kim Sư Vương',be:'🦁',m:[['Thạch Tượng','🗿',1.4],['Kim Sư','🦁',1],['Linh Tượng','🐘',1.3]]}];
const RP=[{bg:'#0f3a2a',t:'#5fe0a0',d:'#bfffd0',r:'#2a6a4a'},{bg:'#3a0f0a',t:'#ff6a2a',d:'#ffb347',r:'#6a2a1a'},{bg:'#0f2a3f',t:'#8fd8ff',d:'#e0f6ff',r:'#3a6a8a'},{bg:'#1f0f3a',t:'#b06aff',d:'#e0b0ff',r:'#4a2a7a'},{bg:'#3a2f0a',t:'#ffd45a',d:'#fff0a0',r:'#7a6a2a'}];
const col=()=>S&&S.sect>=0?SECTS[S.sect].k:'#bfeaff';
const MZ=[[['Linh Thỏ','🐇',28,3,9,3],['Sơn Lang','🐺',55,6,15,5],['Mãng Xà','🐍',80,9,22,7]],
[['Yêu Đằng','🌿',130,13,40,12],['Hắc Hùng','🐻',200,19,60,16],['Quỷ Hồn','👻',170,24,75,20]],
[['Huyết Ma','👹',320,32,130,30],['Hỏa Phượng','🦅',400,40,170,40],['Cự Long','🐉',560,50,250,60]]];
const SK=[{mp:0,cd:.35},{mp:15,cd:2.2},{mp:35,cd:6},{mp:45,cd:9},{mp:22,cd:8,heal:.35}],KB=['j','k','l','i','h'];
const need=l=>Math.floor(40*Math.pow(l,1.5)),mx=l=>({hp:100+l*30,mp:60+l*12,atk:Math.floor((10+l*4)*(S&&S.sect>=0?1.12:1))});
const fresh=()=>{const m=mx(1);return{lv:1,exp:0,hp:m.hp,mp:m.mp,st:10,pl:2,kills:0,sect:-1,name:'',q:{need:5,done:0}}};
let S;try{S=JSON.parse(localStorage.getItem('vdt2'))}catch(e){}S=Object.assign(fresh(),S||{});
const rn=l=>R[Math.min(5,Math.floor((l-1)/5))],tier=l=>`${rn(l)} tầng ${(l-1)%5+1}`;
const sectAt=(x,y,p=0)=>SECTS.findIndex(s=>Math.hypot(x-s.x,y-s.y)<SR+p);
const safe=(x,y,p=0)=>realm!=null?Math.hypot(x-120,y-RH/2)<170+p:sectAt(x,y,p)>=0;
const zone=(x,y)=>{if(realm!=null)return 1;if(sectAt(x,y)>=0)return 0;const d=Math.hypot(x-CX,y-CY);return d<1000?1:d<1700?2:3};
const hs=(a,b)=>{let h=Math.imul(a,374761393)+Math.imul(b,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
const P={x:CX,y:CY+160,fx:1,fy:0,t:0,mv:0,hit:0,atk:0,aim:0,sg:1},cds=[0,0,0,0,0],M=[],B=[],FL=[],BO=[],PT=[],T=[];
let auto=false,dlg=null,zoom=1,w=0,h=0,cx=0,cy=0,mt=0,last=performance.now(),sh=0,flash=0,started=false,rows=[],uid=null,db=null,dirty=1;
const WNPC=[];SECTS.forEach((c,i)=>{const o=(n,em,dx,dy,role)=>WNPC.push({n,em,x:c.x+dx,y:c.y+dy,role,sect:i,col:c.k});
o('Trưởng Lão '+c.sh,'👴',0,-150,'elder');o('Chấp Sự Đường','📜',-185,-65,'quest');o('Đan Sư','⚗️',185,-65,'shop');o('Cổng '+REALMS[i].n,'🌀',0,190,'portal')});
let NP=WNPC;const EXITN={n:'Cổng Rời Bí Cảnh',em:'🌀',x:150,y:RH/2,role:'exit',col:'#5fd1b0'};
for(let i=0;i<1100;i++){const x=hs(i,1)*WW,y=hs(i,2)*WH;if(sectAt(x,y,60)<0)T.push({x,y,s:.7+hs(i,3)*.8})}
// input
const K={},H4=[0,0,0,0,0];let jx=0,jy=0;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!started)return;K[k]=1;if(k=='e')interact();if(k=='r')pill();if(k=='escape'){closeD();$('lb').style.display='none'}if(KB.includes(k)||k.startsWith('arrow')||k==' ')e.preventDefault()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
document.querySelectorAll('[data-s]').forEach(b=>{const i=+b.dataset.s;b.onpointerdown=e=>{e.preventDefault();H4[i]=1};['pointerup','pointerleave','pointercancel'].forEach(v=>b['on'+v]=()=>H4[i]=0)});
$('pb').onclick=pill;$('e').onclick=interact;$('ab').onclick=()=>{auto=!auto;$('ab').classList.toggle('on',auto)};
const joy=$('joy'),kn=joy.firstElementChild;let jid=null;
function jm(e){const r=joy.getBoundingClientRect();let dx=e.clientX-r.left-62,dy=e.clientY-r.top-62;const l=Math.hypot(dx,dy),m=Math.min(l,52);if(l>0){dx=dx/l*m;dy=dy/l*m}jx=dx/52;jy=dy/52;kn.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId==jid)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;jx=jy=0;kn.style.transform=''};
function say(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(m.t);m.t=setTimeout(()=>m.style.opacity=0,2400)}
// fx
function sp(x,y,c,n,v,l,s,up){for(let i=0;i<n;i++){const a=Math.random()*6.283,q=v*(.2+Math.random());PT.push({x,y,vx:Math.cos(a)*q,vy:Math.sin(a)*q-(up||0),l:l*(.5+Math.random()*.5),m:l,c,s:s*(.5+Math.random())})}}
function ring(x,y,r,c,t){BO.push({k:'r',x,y,r,c,t,m:t})}
function fl(x,y,t,c,s){FL.push({x,y,t,c,s:s||15,l:.9})}
// combat
function nearest(r){let b=null,bd=r;for(const m of M){const d=Math.hypot(m.x-P.x,m.y-P.y);if(d<bd){bd=d;b=m}}return b}
function hurt(m,d,ax,ay,kb){const cr=Math.random()<.15,v=Math.floor(d*(cr?2:1)*(.9+Math.random()*.2));m.hp-=v;m.fl=.15;m.ch=1;
const l=Math.hypot(ax,ay)||1;m.kx=(m.kx||0)+ax/l*(kb||160);m.ky=(m.ky||0)+ay/l*(kb||160);
fl(m.x,m.y-m.r-10,(cr?'💥':'')+v,cr?'#ffd45a':'#fff',cr?24:16);sp(m.x,m.y,cr?'#ffd45a':'#ffffff',cr?14:7,200,.35,3);
if(m.hp<=0){M.splice(M.indexOf(m),1);S.st+=m.st;S.q.done++;S.kills++;dirty=1;if(m.boss)bossDown(m);fl(m.x,m.y-40,`+${m.exp} tu vi`,'#e8c070',15);sp(m.x,m.y,'#ffb347',m.el?60:26,320,.7,4);sp(m.x,m.y,'#9fffe0',12,90,1.2,3,50);ring(m.x,m.y,m.r*3,'#ffd45a',.35);sh=Math.max(sh,m.el?14:5);gain(m.exp)}}
function gain(n){S.exp+=n;let up=0;while(S.exp>=need(S.lv)){S.exp-=need(S.lv);S.lv++;up=1}
if(up){const m=mx(S.lv);S.hp=m.hp;S.mp=m.mp;dirty=1;const t=(S.lv-1)%5+1;say(t==1?`Đột phá ${rn(S.lv)}!`:`Lên tầng ${t} ${rn(S.lv)}`);ring(P.x,P.y,260,'#ffe08a',.8);sp(P.x,P.y,'#ffe08a',70,380,1,4,60);flash=.4;sh=12}}
function explode(x,y,r,d){ring(x,y,r,col(),.45);ring(x,y,r*.6,'#ffffff',.3);sp(x,y,col(),80,520,.8,6);sp(x,y,'#ffffff',40,380,.6,4);sp(x,y,'#444',20,200,1,8,30);sh=Math.max(sh,16);flash=Math.max(flash,.18);
M.slice().forEach(q=>{const dd=Math.hypot(q.x-x,q.y-y);if(dd<r+q.r)hurt(q,d*(1-dd/(r+q.r)*.4),q.x-x,q.y-y,420)})}
function cast(i){const s=SK[i],m=mx(S.lv);if(cds[i]>0||S.mp<s.mp||dlg||!started)return;
if(s.heal){S.mp-=s.mp;cds[i]=s.cd;const v=Math.floor(m.hp*s.heal);S.hp=Math.min(m.hp,S.hp+v);fl(P.x,P.y-70,'+'+v,'#5fd1b0',20);ring(P.x,P.y,120,'#5fd1b0',.6);sp(P.x,P.y,'#9fffd0',40,120,1.2,3,120);return}
const tg=nearest(620);let a=Math.atan2(P.fy,P.fx);if(tg)a=Math.atan2(tg.y-P.y,tg.x-P.x);P.aim=a;P.atk=.3;if(Math.cos(a)<-.1)P.sg=-1;else if(Math.cos(a)>.1)P.sg=1;
if(i==2){const ts=M.filter(q=>Math.hypot(q.x-P.x,q.y-P.y)<450);if(!ts.length)return;S.mp-=s.mp;cds[i]=s.cd;ring(P.x,P.y,450,col(),.5);flash=.55;sh=22;
ts.forEach(q=>{const p=[];let x=q.x+(Math.random()-.5)*30,y=q.y-800;p.push([x,y]);for(let k=1;k<9;k++){x=q.x+(Math.random()-.5)*60*(1-k/9);y=q.y-800+k*(800/9);p.push([x,y])}p.push([q.x,q.y]);BO.push({k:'b',p,t:.5,m:.5,c:col()});ring(q.x,q.y,110,col(),.4);sp(q.x,q.y,col(),30,400,.5,4);hurt(q,m.atk*6,q.x-P.x,q.y-P.y,380)});return}
S.mp-=s.mp;cds[i]=s.cd;
if(i==0)B.push({t:'w',x:P.x,y:P.y-18,vx:Math.cos(a)*820,vy:Math.sin(a)*820,a,d:m.atk*1.6,l:.75,hit:new Set()});
