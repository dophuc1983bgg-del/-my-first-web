function validateSave(s){
  if(!s||typeof s!=='object')return null;
  const base={lv:1,exp:0,hp:100,mp:60,st:10,pl:2,kills:0,bossKills:0,sect:-1,name:'',q:{need:5,done:0},inv:{},ach:{},petOn:false,weapon:'w_0_0',weaponsOwned:['w_0_0'],companion:'',companions:['c_0_0'],char:'ch_0',armor:50,upgrades:{hp:0,mp:0,atk:0,spd:0,exp:0,armor:0},chainBest:0,realmUnlocks:0,speedMul:1};
  const out=Object.assign(Object.create(null),base);
  out.lv=clampNum(s.lv,1,999,1);out.exp=clampNum(s.exp,0,1e12,0);
  out.hp=clampNum(s.hp,0,1e15,100);out.mp=clampNum(s.mp,0,1e15,60);out.armor=clampNum(s.armor,0,1e15,50);
  out.st=clampNum(s.st,0,1e15,10);out.pl=clampNum(s.pl,0,1e6,0);
  out.kills=clampNum(s.kills,0,1e8,0);out.bossKills=clampNum(s.bossKills,0,1e4,0);
  out.chainBest=clampNum(s.chainBest,0,1000,0);out.realmUnlocks=clampNum(s.realmUnlocks,0,R_MAX,0);
  const sm=Number(s.speedMul);out.speedMul=Number.isFinite(sm)?Math.max(.5,Math.min(3,sm)):1;
  out.sect=(Number.isFinite(+s.sect)&&+s.sect>=-1&&+s.sect<5)?Math.floor(+s.sect):-1;
  out.petOn=!!s.petOn;out.name=sanitize(s.name).slice(0,14)||'';
  out.char=CHAR_IDS.has(s.char)?s.char:'ch_0';
  out.inv=Object.create(null);
  if(s.inv&&typeof s.inv==='object'&&!Array.isArray(s.inv))
    for(const k of Object.keys(s.inv)){if(DANGEROUS_KEYS.has(k))continue;if(!ITEM_IDS.has(k))continue;const v=clampNum(s.inv[k],0,1e6,0);if(v>0)out.inv[k]=v}
  out.ach=Object.create(null);
  if(s.ach&&typeof s.ach==='object'&&!Array.isArray(s.ach))
    for(const k of Object.keys(s.ach)){if(DANGEROUS_KEYS.has(k))continue;if(s.ach[k])out.ach[k]=1}
  out.upgrades={hp:0,mp:0,atk:0,spd:0,exp:0,armor:0};
  if(s.upgrades&&typeof s.upgrades==='object')for(const u of CHAR_UPGRADES)out.upgrades[u.id]=clampNum(s.upgrades[u.id],0,u.max,0);
  const wSeen=new Set(['w_0_0']);out.weaponsOwned=['w_0_0'];
  if(Array.isArray(s.weaponsOwned))for(const id of s.weaponsOwned){if(typeof id!=='string'||!WEAPON_IDS.has(id)||wSeen.has(id))continue;wSeen.add(id);out.weaponsOwned.push(id)}
  out.weapon=(typeof s.weapon==='string'&&WEAPON_IDS.has(s.weapon))?s.weapon:'w_0_0';
  if(!wSeen.has(out.weapon))out.weapon='w_0_0';
  const cSeen=new Set(['c_0_0']);out.companions=['c_0_0'];
  if(Array.isArray(s.companions))for(const id of s.companions){if(typeof id!=='string'||!COMPANION_IDS.has(id)||cSeen.has(id))continue;cSeen.add(id);out.companions.push(id)}
  out.companion=(typeof s.companion==='string'&&COMPANION_IDS.has(s.companion))?s.companion:'';
  out.q={need:5,done:0};
  if(s.q&&typeof s.q==='object'){out.q.need=clampNum(s.q.need,1,10000,5);out.q.done=clampNum(s.q.done,0,10000,0)}
  return out;
}

  const label=pick.t==='gems'?'đŸ’':pick.t==='potions'?'đŸ§ª':'đŸ“ˆ cáº¥p';
  return{type:pick.t,amount:amt,msg:`${amt.toLocaleString()} ${label}`};
}

function upd(dt){
  const gdt=dt*(timeScale||1);mt+=gdt;
  sh*=Math.pow(0.002,dt);flash=Math.max(0,flash-dt);
  if(!started)return;
  broadcastPos();

  for(const k in P.buffs)if(P.buffs[k]>0)P.buffs[k]=Math.max(0,P.buffs[k]-gdt);
  if(mt-P.lastCombat>4)P.rage=Math.max(0,P.rage-gdt*5);
  let ax=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0)+jx;
  let ay=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0)+jy;
  const l=Math.hypot(ax,ay),m=mx(S.lv);
  const spdMul=1+((S.upgrades&&S.upgrades.spd)||0)*.1;
  const realmIdx=Math.floor((S.lv-1)/5);
  const realmCap=realmIdx<10?320:realmIdx<25?420:realmIdx<50?500:560;
  const baseSpd=Math.min(realmCap,200+Math.log2(S.lv+1)*35);
  const spd=baseSpd*spdMul;
  if(P.buffs.invuln<=0){if(l>.1){const n=Math.min(1,l);ax/=l;ay/=l;
      P.x=Math.max(30,Math.min(W-30,P.x+ax*spd*n*gdt));P.y=Math.max(30,Math.min(H-30,P.y+ay*spd*n*gdt));
      P.fx=ax;P.fy=ay;P.t+=gdt*11;P.mv+=(n-P.mv)*.3;if(Math.abs(ax)>.2)P.sg=ax<0?-1:1}else P.mv*=.8}else P.mv*=.5;
  P.atk=Math.max(0,P.atk-dt);
  for(let i=0;i<8;i++){if(isAdmin)cds[i]=0;else cds[i]=Math.max(0,cds[i]-gdt);if(H4[i]||K[KB[i]])cast(i)}
  if(auto){const t=nearest(480);if(S.hp<m.hp*.4&&cds[4]<=0)cast(4);else if(t){cast(2);cast(1);cast(0);if(M.length>3)cast(7)}if(P.rage>=100){if(Math.random()<.5)useSpecial();else useWeaponSpecial()}}
  if(P.shield>0)P.shield=Math.max(0,P.shield-gdt);
  S.mp=Math.min(m.mp,S.mp+gdt*(2.5+S.lv*.35));
  const inS=safe(P.x,P.y);
  if(inS)S.hp=Math.min(m.hp,S.hp+gdt*m.hp*.07);
  if(mt-P.lastCombat>3)S.armor=Math.min(m.armor,(S.armor||0)+gdt*m.armor*.15);
  P.hit=Math.max(0,P.hit-dt);
  if(realm===null){if(M.length<70&&Math.random()<gdt*6)spawn()}else if(M.length<22&&Math.random()<gdt*2)spawnR();
  for(let qi=M.length-1;qi>=0;qi--){const q=M[qi];if(!q)continue;
    q.fl=Math.max(0,q.fl-dt);q.cd-=gdt;
    if(q.frozen>0){q.frozen=Math.max(0,q.frozen-dt);continue}
    if(q.poison>0){q.poison=Math.max(0,q.poison-dt);q.poisonTick=(q.poisonTick||0)+gdt;
      if(q.poisonTick>=1){q.poisonTick=0;q.hp-=q.poisonDmg||10;dmg(q.x,q.y-q.r-6,q.poisonDmg||10,false,'poison');
        if(q.hp<=0){killMonster(q);continue}}}
    const dx=P.x-q.x,dy=P.y-q.y,d=Math.hypot(dx,dy);
    let vx=0,vy=0,s=q.sp;
    if((d<260||q.ch)&&!inS&&d<560){vx=dx/d;vy=dy/d;s*=1.5;
      if(d<q.r+18&&q.cd<=0){q.cd=1;
        // DMG quĂ¡i scale theo realm ngÆ°á»i chÆ¡i (cĂ³ cap)
        const dmgScale=Math.min(80,1+m.hp/500);
        let v=Math.max(1,Math.floor(q.atk*(.8+Math.random()*.4)*dmgScale));
        if(isAdmin||P.buffs.invuln>0)v=0;
        if(P.shield>0){v=Math.floor(v*.15);sp(P.x,P.y,'#6aa8ff',8,150,.3,2)}
        if(v>0){const absorbed=Math.min(S.armor||0,v);S.armor=Math.max(0,(S.armor||0)-absorbed);
          const remaining=v-absorbed;
