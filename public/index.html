<!DOCTYPE html>
<html lang="vi">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>Váº¥n Äáº¡o Tu TiĂªn</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d11;--panel:#0d1c22ea;--line:#35605c;--jade:#5fd1b0;--gold:#e8c070;--red:#e0553f;--ink:#ece8da;--dim:#9db0aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(5px);box-shadow:0 4px 24px #0008}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;width:230px;padding:9px 11px;z-index:2}
#realm{font:700 16px 'Noto Serif','Times New Roman',Georgia,serif;color:var(--gold);display:flex;justify-content:space-between}
.b{height:10px;background:#04080a;border-radius:5px;margin:4px 0;overflow:hidden;border:1px solid #1d3a3a;position:relative}
.b i{display:block;height:100%;width:50%;transition:width .15s}
.b b{position:absolute;right:4px;top:-2px;font:600 9px 'Be Vietnam Pro',Arial;color:#fff;text-shadow:0 1px 2px #000}
#hp i{background:linear-gradient(90deg,#a8321f,#ff6a4a)}
#mp i{background:linear-gradient(90deg,#2d62c8,#7fc0ff)}
#xp i{background:linear-gradient(90deg,#b8862f,#ffe08a)}
#ar i{background:linear-gradient(90deg,#8a7a30,#e0d090)}
#rg i{background:linear-gradient(90deg,#7a2060,#ff5ad0)}
#res{font-size:12px;color:var(--dim)}
#hud button{margin-top:6px;width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:#1b2e32;color:var(--ink);font:600 12px 'Noto Serif','Times New Roman',serif;cursor:pointer}
#hud button.gold{border-color:var(--gold);color:var(--gold)}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;text-align:right;z-index:2}
#mm{display:block;border-radius:10px;border:1px solid var(--line);background:#0008;margin-left:auto}
#zn{font:600 14px 'Noto Serif','Times New Roman',serif;color:var(--jade);margin-top:4px;text-shadow:0 1px 4px #000}
#qs{font-size:12px;color:var(--dim);text-shadow:0 1px 4px #000}
#chain{font:700 13px 'Noto Serif','Times New Roman',serif;color:#ff8a5a;text-shadow:0 1px 4px #000;margin-top:2px}
#btns{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,56px);gap:6px;z-index:2}
#btns button{position:relative;overflow:hidden;width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);background:#10252bdd;color:var(--ink);font-size:22px;cursor:pointer;padding:0;box-shadow:0 0 12px #e8c07044}
#btns button small{position:absolute;bottom:1px;left:0;right:0;font-size:9px;color:var(--dim)}
#btns .cd{position:absolute;left:0;bottom:0;width:100%;background:#000b;height:0}
#btns button.on{background:var(--gold);color:#000}
#e{display:none;grid-column:1/5;width:auto!important;border-radius:24px!important;height:44px!important;font:600 15px 'Noto Serif','Times New Roman',serif!important;color:var(--bg)!important;background:var(--jade)!important;border-color:var(--jade)!important}
#joy{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;border:2px solid var(--line);background:#0f1f2488;display:none;z-index:2}
#joy i{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:var(--jade);opacity:.7}
@media(pointer:coarse){#joy{display:block}}
.dlg{position:fixed;left:50%;transform:translateX(-50%);width:min(560px,94vw);padding:14px;display:none;z-index:5}
#dlg{bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:72vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scroll-behavior:smooth}
#dlg button{display:block;width:100%;text-align:left;white-space:normal;line-height:1.3;padding:8px 12px;margin:0 0 4px 0}
#lb,#achp,#invc,#adminp,#charp{top:50%;transform:translate(-50%,-50%);max-height:85vh;overflow:auto}
#adminp{width:min(760px,96vw)}
#charp{width:min(760px,96vw)}
#codep{width:min(420px,92vw)}
.dlg h2{margin:0 0 6px;font:700 18px 'Noto Serif','Times New Roman',serif;color:var(--gold)}
.dlg p{margin:0 0 10px}
.dlg button,#go{padding:9px 14px;margin:0 6px 6px 0;border-radius:8px;border:1px solid var(--line);background:#1b2e32;color:var(--ink);font:inherit;cursor:pointer}
.dlg button.m,#go{background:var(--jade);color:var(--bg);border-color:var(--jade);font-weight:500}
.dlg button:disabled{opacity:.4}
.dlg button.danger{background:#5a1e18;border-color:var(--red);color:#ffb0a0}
.r{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;margin-bottom:4px;background:#ffffff08;flex-wrap:wrap}
.r.me{background:#5fd1b026;outline:1px solid var(--jade)}
.r .k{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px 'Noto Serif','Times New Roman',serif;background:#1b2e32;flex:none}
.r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r .s{font-size:12px;color:var(--dim);text-align:right}
#tip{position:fixed;left:50%;bottom:26%;transform:translateX(-50%);text-align:center;padding:10px 14px;pointer-events:none;transition:opacity 1s;max-width:90vw;font-size:13px;z-index:3}
#msg{position:fixed;left:50%;top:20%;transform:translateX(-50%);font:700 24px 'Noto Serif','Times New Roman',serif;color:var(--gold);text-shadow:0 2px 12px #000;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;z-index:4}
.screen{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#16413f,#070d11 70%);text-align:center;padding:20px}
.screen h1{font:700 clamp(28px,7vw,50px)/1.1 'Noto Serif','Times New Roman',serif;color:var(--gold);margin:0;text-shadow:0 0 30px #e8c07066}
.screen p{margin:0;color:var(--dim);max-width:440px}
.screen input{padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:#0d1c22;color:var(--ink);font:inherit;text-align:center;width:240px}
#go{font:600 16px 'Noto Serif','Times New Roman',serif;padding:12px 30px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold)}
#auth .box{width:min(400px,92vw);padding:22px 20px;display:flex;flex-direction:column;gap:10px}
#auth h1{font-size:30px;margin-bottom:4px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0d1c22;color:var(--dim);font:600 13px 'Be Vietnam Pro',Arial;cursor:pointer}
.tabs button.active{background:#1b2e32;color:var(--gold);border-color:var(--gold)}
.af{display:flex;flex-direction:column;gap:8px}
#auth input{width:100%;text-align:left}
#auth button.act{padding:11px;border-radius:8px;border:1px solid var(--jade);background:var(--jade);color:#07131a;font:600 15px 'Noto Serif','Times New Roman',serif;cursor:pointer}
#amsg{min-height:18px;font-size:12px;color:var(--red);text-align:center}
#amsg.ok{color:var(--jade)}
#adm{position:fixed;right:8px;top:calc(160px + env(safe-area-inset-top,0px));padding:6px 10px;border-radius:8px;background:#3a1d0f;border:1px solid var(--red);color:var(--gold);font:700 11px 'Noto Serif','Times New Roman',serif;cursor:pointer;z-index:3;display:none}
#spdBtn{position:fixed;left:8px;top:calc(220px + env(safe-area-inset-top,0px));padding:6px 12px;border-radius:8px;background:#1b2e32;border:1px solid var(--gold);color:var(--gold);font:700 11px 'Noto Serif','Times New Roman',serif;cursor:pointer;z-index:3}
#codeBtn{position:fixed;right:8px;top:calc(240px + env(safe-area-inset-top,0px));padding:6px 12px;border-radius:8px;background:#1b2e32;border:1px solid var(--gold);color:var(--gold);font:700 11px 'Noto Serif','Times New Roman',serif;cursor:pointer;z-index:3}
#codeBoard{position:fixed;left:50%;top:80px;transform:translateX(-50%);padding:10px 16px;background:linear-gradient(135deg,#3a1d0f,#5a2a1a);border:2px solid var(--gold);border-radius:12px;color:var(--gold);font:700 18px 'Noto Serif','Times New Roman',serif;text-align:center;z-index:6;display:none;box-shadow:0 0 30px #e8c07088;max-width:90vw}
#codeBoard .cd{font-size:11px;color:var(--dim);font-weight:400;margin-top:4px}
#codeInp{width:100%;padding:10px;border-radius:6px;border:1px solid var(--line);background:#0d1c22;color:var(--gold);font:700 24px 'Noto Serif','Times New Roman',serif;text-align:center;letter-spacing:6px;font-family:'Courier New',monospace}
#codeMsg{font-size:12px;color:var(--dim);margin-top:6px;text-align:center;min-height:16px}
.item{display:flex;gap:8px;padding:6px;border-radius:6px;background:#ffffff08;margin-bottom:4px;align-items:center;font-size:13px}
.item .ic{font-size:20px}
.item .q{margin-left:auto;color:var(--gold);font-weight:600}
.shop-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#ffffff08;margin-bottom:5px;font-size:13px}
.shop-row .ic{font-size:22px;flex:none}
.shop-row .info{flex:1;min-width:0}
.shop-row .info b{display:block;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-row .info span{font-size:11px;color:var(--dim)}
.shop-row button{padding:6px 10px!important;margin:0!important;font-size:12px!important;flex:none}
.shop-row.owned{background:#1b3e3222;border:1px solid #5fd1b044}
.shop-row.owned button{background:#1b3e32;border-color:var(--jade);color:var(--jade)}
#lbTabs,#adminTabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
#lbTabs button,#adminTabs button{flex:1;padding:6px;border-radius:6px;border:1px solid var(--line);background:#0d1c22;color:var(--dim);font:600 11px Arial;cursor:pointer}
#lbTabs button.active,#adminTabs button.active{background:#1b2e32;color:var(--gold);border-color:var(--gold)}
#dlg.chain{border-color:#ff8a5a;box-shadow:0 4px 30px #ff8a5a55}
.adf{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.adf label{font-size:12px;color:var(--dim)}
.adf input,.adf select{padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:#0d1c22;color:var(--ink);font:inherit;width:100%}
.apRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.apRow>*{flex:1;min-width:120px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-left:4px}
.badge.admin{background:#5a3a10;color:#ffe08a}
.badge.on{background:#1b5e32;color:#8fe0a0}
.badge.off{background:#5a1e18;color:#ffb0a0}
#adminp h3{font:600 14px 'Noto Serif','Times New Roman',serif;color:var(--gold);margin:12px 0 6px}
#adminp .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:10px}
#adminp .info-cell{background:#ffffff08;padding:8px;border-radius:6px;font-size:12px}
#adminp .info-cell b{display:block;color:var(--gold);font-size:11px;margin-bottom:2px}
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;max-height:60vh;overflow:auto;padding:4px}
.char-cell{padding:8px;border-radius:8px;background:#ffffff08;border:1px solid transparent;cursor:pointer;text-align:center;font-size:12px}
.char-cell:hover{background:#ffffff15;border-color:var(--gold)}
.char-cell.sel{background:#5fd1b026;border-color:var(--jade)}
.char-cell .em{font-size:24px;display:block}
.char-cell .nm{font-weight:600;color:var(--gold);display:block;margin:2px 0}
.char-cell .sp{font-size:10px;color:var(--dim)}
.dlg::-webkit-scrollbar,#dlg::-webkit-scrollbar,#lb::-webkit-scrollbar,#invc::-webkit-scrollbar,#achp::-webkit-scrollbar,#adminp::-webkit-scrollbar,#charp::-webkit-scrollbar,.char-grid::-webkit-scrollbar{width:6px}
.dlg::-webkit-scrollbar-thumb,#dlg::-webkit-scrollbar-thumb,#lb::-webkit-scrollbar-thumb,#invc::-webkit-scrollbar-thumb,#achp::-webkit-scrollbar-thumb,#adminp::-webkit-scrollbar-thumb,#charp::-webkit-scrollbar-thumb,.char-grid::-webkit-scrollbar-thumb{background:#35605c;border-radius:3px}
#adminSummon{position:fixed;right:8px;top:calc(200px + env(safe-area-inset-top,0px));padding:6px 10px;border-radius:8px;background:#1b2e32;border:1px solid var(--jade);color:var(--jade);font:700 11px 'Noto Serif','Times New Roman',serif;cursor:pointer;z-index:3;display:none}
#net{position:fixed;left:50%;top:8px;transform:translateX(-50%);padding:4px 12px;border-radius:12px;background:#0d1c22cc;border:1px solid var(--line);font-size:11px;color:var(--jade);z-index:2}

/* ============ MOBILE OPTIMIZATION ============ */

  #joy i{width:40px;height:40px;left:26px;top:26px}
  .dlg{width:min(96vw,560px);padding:10px;border-radius:10px}

  .dlg h2{font-size:15px;margin-bottom:4px}
  .dlg p{font-size:11.5px;margin-bottom:7px}

  #lb,#achp,#invc,#adminp,#charp{max-height:82vh;padding:10px}
  #spdBtn{padding:4px 8px;font-size:9.5px;top:calc(178px + env(safe-area-inset-top,0px));left:6px}
  #codeBtn{padding:4px 8px;font-size:9.5px;top:calc(198px + env(safe-area-inset-top,0px));right:6px}
  #adm{padding:4px 8px;font-size:9.5px;top:calc(140px + env(safe-area-inset-top,0px));right:6px}

  #msg{font-size:18px;top:22%}
  .screen{gap:10px;padding:14px}
  .screen h1{font-size:clamp(22px,8vw,36px)}
  .screen p{font-size:12px;max-width:92vw}
  .screen input{padding:9px 12px;font-size:13px;width:210px}
  #go{padding:11px 24px;font-size:14px}
  #auth .box{padding:16px 14px;gap:8px}
  #auth h1{font-size:22px}
  #auth input{padding:9px 12px;font-size:13px}
  #auth button.act{padding:10px;font-size:13px}
  .tabs button{padding:7px;font-size:12px}
  #pickChar{padding:8px 16px!important;font-size:12px!important}

  .shop-row{padding:6px;gap:8px;font-size:12px}

  .shop-row button{padding:5px 8px!important;font-size:11px!important}
  .item{font-size:12px;padding:5px}
  .item .ic{font-size:18px}
  .r{padding:6px;gap:8px;font-size:12px}
  .r .k{width:24px;height:24px;font-size:11px}

}
@media (max-height:500px) and (pointer:coarse){
  #hud{width:150px;transform:scale(.85);transform-origin:top left}
  #top{transform:scale(.85);transform-origin:top right}
  #btns{transform:scale(.8);transform-origin:bottom right}
  #joy{transform:scale(.85);transform-origin:bottom left}
}
</style>
</head>
